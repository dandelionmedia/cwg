<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>철원여고 AI 실습 프롬프트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 철원 밤하늘 띠(헤더) + 황금 들판 선 → 교시 순서대로 이어지는 섹션, 프롬프트는 '복사 카드'로 */
:root{
  --bg:#F2F4EE; --surface:#FFFFFF; --ink:#15233A; --muted:#55617A; --line:#D7DCCD;
  --band:#14223B; --band-ink:#F4F1E4; --band-muted:#B9C2D6;
  --gold:#A86F00; --gold-soft:#FBEAB4; --btn:#F2B630; --btn-ink:#14223B; --btn-hover:#E1A21A;
  --crane:#C2352A; --crane-soft:#FBE3DF;
  --mark:#FFE36E; --mark-ink:#15233A;
  --ok:#1F7A4D;
  --f-display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1524; --surface:#16213A; --ink:#EEF1F7; --muted:#A9B3C7; --line:#2A3755;
  --band:#08101E; --band-ink:#F4F1E4; --band-muted:#9FAACB;
  --gold:#F2B630; --gold-soft:#3A3118; --btn:#F2B630; --btn-ink:#14223B; --btn-hover:#FFC94D;
  --crane:#FF8A7A; --crane-soft:#3D1F22;
  --mark:rgba(242,182,48,.30); --mark-ink:#FFEDB5; --ok:#5BD69A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#16213A; --ink:#EEF1F7; --muted:#A9B3C7; --line:#2A3755;
  --band:#08101E; --band-ink:#F4F1E4; --band-muted:#9FAACB;
  --gold:#F2B630; --gold-soft:#3A3118; --btn:#F2B630; --btn-ink:#14223B; --btn-hover:#FFC94D;
  --crane:#FF8A7A; --crane-soft:#3D1F22;
  --mark:rgba(242,182,48,.30); --mark-ink:#FFEDB5; --ok:#5BD69A; color-scheme:dark}

html{font-size:17px;scroll-behavior:smooth;scroll-padding-top:84px}
@media (min-width:600px){html{font-size:18px}}
@media (min-width:1100px){html{font-size:19px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--btn);outline-offset:2px;border-radius:6px}

/* ── 헤더 ── */
.hero{background:var(--band);color:var(--band-ink);position:relative;overflow:hidden}
.hero .wrap{padding-block:2.2rem 0;position:relative;z-index:1}
.eyebrow{display:inline-block;font-weight:700;font-size:.82rem;letter-spacing:.12em;color:var(--btn);border:1.5px solid var(--btn);border-radius:999px;padding:.15rem .8rem}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.15;margin-top:.8rem;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--btn)}
.hero .sub{font-size:1.15rem;font-weight:500;margin-top:.5rem;color:var(--band-ink)}
.hero .meta{color:var(--band-muted);font-size:.95rem;margin-top:.3rem}
.tools{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.3rem}
.tools a{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.28);color:var(--band-ink);text-decoration:none;font-weight:700;padding:.6rem 1.1rem;border-radius:12px;font-size:1rem}
.tools a:hover{background:rgba(255,255,255,.16)}
.tools a span{color:var(--band-muted);font-weight:500;font-size:.85rem}
.horizon{display:block;width:100%;height:auto;margin-top:1.2rem}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0}

/* ── 내비 ── */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:.4rem;overflow-x:auto;padding-block:.6rem;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;display:flex;align-items:center;gap:.4rem;text-decoration:none;color:var(--muted);font-weight:700;font-size:.95rem;padding:.45rem .9rem;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);white-space:nowrap}
nav.tabs a b{font-family:var(--f-display);font-weight:400;color:var(--gold)}
nav.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs a.on b{color:var(--btn)}

/* ── 섹션 ── */
main section{padding-block:2.6rem 1rem;border-bottom:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;align-items:start;margin-bottom:1.2rem}
.sec-num{grid-row:span 2;font-family:var(--f-display);font-size:3.4rem;line-height:1;color:var(--gold)}
.sec-kicker{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chip{display:inline-block;font-size:.8rem;font-weight:700;padding:.12rem .65rem;border-radius:999px;background:var(--gold-soft);color:var(--gold);letter-spacing:.02em}
.chip.time{background:var(--crane-soft);color:var(--crane)}
.sec-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,4.6vw,2.4rem);line-height:1.25}
.goal{grid-column:1/-1;margin:.6rem 0 0;color:var(--muted);font-size:1.05rem;max-width:62ch}
.goal strong{color:var(--ink)}
h3.step{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;font-size:1.3rem;font-weight:900;margin:2rem 0 .9rem}
h3.step .s{font-family:var(--f-display);font-weight:400;color:var(--bg);background:var(--ink);font-size:.95rem;padding:.12rem .6rem;border-radius:6px;letter-spacing:.04em}
h3.step small{font-weight:500;color:var(--muted);font-size:.95rem}
.note{color:var(--muted);font-size:1rem;margin:.4rem 0 0}

/* ── 프롬프트 카드 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:1rem}
.grid.one{grid-template-columns:1fr}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem 1rem;display:flex;flex-direction:column;gap:.7rem;min-width:0}
.pcard.bad{border-style:dashed}
.pcard .top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.pcard .label{font-weight:900;font-size:1.05rem}
.tag-bad{font-size:.78rem;font-weight:700;color:var(--crane);background:var(--crane-soft);padding:.1rem .55rem;border-radius:999px}
.tag-good{font-size:.78rem;font-weight:700;color:var(--ok);border:1.5px solid currentColor;padding:.05rem .5rem;border-radius:999px}
.tag-img{font-size:.78rem;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:.1rem .55rem;border-radius:999px}
.ptext{font-size:1.18rem;line-height:1.8;margin:0;flex:1;white-space:pre-wrap}
.prefix{display:block;color:var(--gold);font-weight:700;font-size:.98rem}
mark.fill{background:linear-gradient(transparent 38%,var(--mark) 38%);color:var(--mark-ink);padding:0 .1em;font-weight:700;border-radius:2px}
.copy{align-self:flex-end;display:inline-flex;align-items:center;gap:.45rem;background:var(--btn);color:var(--btn-ink);border:0;border-radius:12px;font-weight:900;font-size:1.02rem;padding:.65rem 1.25rem;min-height:48px;transition:background .15s,transform .1s}
.copy:hover{background:var(--btn-hover)}
.copy:active{transform:scale(.97)}
.copy.done{background:var(--ok);color:#fff}
.copy svg{width:1.1em;height:1.1em}

/* ── 기타 블록 ── */
.formula{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:.7rem;margin-top:.4rem}
.fx{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.9rem 1rem;min-width:0}
.fx b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.4rem;color:var(--gold)}
.fx span{display:block;font-weight:700}
.fx i{display:block;font-style:normal;color:var(--muted);font-size:.95rem;margin-top:.2rem}
.chain{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;font-weight:700;font-size:1.08rem;margin-top:.3rem}
.chain span{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.35rem .8rem}
.chain i{font-style:normal;color:var(--gold);font-weight:900}
.callout{display:flex;gap:.8rem;align-items:flex-start;background:var(--crane-soft);color:var(--ink);border-radius:14px;padding:1rem 1.1rem;margin-top:1.2rem;font-size:1.02rem}
.callout b{color:var(--crane)}
.callout.tip{background:var(--gold-soft)}
.callout.tip b{color:var(--gold)}
.result{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:1.4rem;font-weight:700;font-size:1.05rem}
.result span{background:var(--ink);color:var(--bg);font-size:.8rem;padding:.15rem .6rem;border-radius:6px}
.jobbox{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;background:var(--surface);border:2px solid var(--btn);border-radius:14px;padding:.9rem 1rem;margin-bottom:1rem}
.jobbox label{font-weight:900;font-size:1.05rem}
.jobbox input{flex:1 1 220px;min-width:0}
input[type=text],textarea{font:inherit;font-size:1.08rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--btn);box-shadow:0 0 0 3px var(--gold-soft)}
.words{display:grid;gap:.9rem}
.words .row{display:grid;grid-template-columns:7.5rem 1fr;gap:.6rem;align-items:start}
@media (max-width:560px){.words .row{grid-template-columns:1fr}}
.words .row > b{padding-top:.35rem}
.wchips{display:flex;flex-wrap:wrap;gap:.4rem}
.wchips button{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:.35rem .85rem;font-size:1rem;font-weight:500}
.wchips button:hover{border-color:var(--btn)}
.wchips button.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.checks{list-style:none;padding:0;margin:.4rem 0 0;display:grid;gap:.5rem}
.checks label{display:flex;gap:.7rem;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.7rem .9rem;font-size:1.05rem;cursor:pointer}
.checks input{width:1.4rem;height:1.4rem;flex:0 0 auto;margin-top:.2rem;accent-color:var(--ok)}
.checks label:has(input:checked){border-color:var(--ok)}
.quote{font-family:var(--f-display);font-weight:400;font-size:clamp(1.4rem,4vw,2rem);line-height:1.35;margin:1.8rem 0 .4rem;text-align:left}
.quote em{font-style:normal;color:var(--gold)}
.steps4{list-style:none;padding:0;margin:0;display:grid;gap:.8rem}
.steps4 > li{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:start}
.steps4 .n{font-family:var(--f-display);font-size:1.6rem;line-height:1.2;color:var(--gold);width:2rem;text-align:center}
.steps4 .body{min-width:0;display:grid;gap:.5rem}
.steps4 .body > b{font-size:1.1rem}
.steps4 .body > p{margin:0;color:var(--muted)}

/* 빌더 */
.builder{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:1.2rem;display:grid;gap:.8rem}
.builder .f{display:grid;grid-template-columns:7rem 1fr;gap:.6rem;align-items:center}
@media (max-width:560px){.builder .f{grid-template-columns:1fr;gap:.25rem}}
.builder .f label{font-weight:900}
.builder .f label small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.preview{border-top:1.5px dashed var(--line);padding-top:.9rem;display:grid;gap:.6rem}
.preview .ptext{font-size:1.12rem}
.brow{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);border-radius:10px;padding:.5rem .9rem;font-weight:700}
.ghost:hover{color:var(--ink);border-color:var(--ink)}
.ethics{counter-reset:e;list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
.ethics li{counter-increment:e;display:grid;grid-template-columns:2.4rem 1fr;gap:.6rem;align-items:baseline;font-size:1.08rem}
.ethics li::before{content:counter(e);font-family:var(--f-display);font-size:1.6rem;color:var(--gold);text-align:center}
.ethics b{margin-right:.3rem}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:1.2rem}

footer{padding-block:2.4rem 3rem;color:var(--muted);font-size:.92rem}
footer b{color:var(--ink)}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:var(--bg);font-weight:700;padding:.85rem 1.3rem;border-radius:14px;z-index:20;transition:transform .25s ease;max-width:calc(100% - 32px);text-align:center;font-size:1rem}
.toast.show{transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<main class="wrap" id="main"></main>

<script>
(function(){
const IMG = "다음 내용으로 이미지를 만들어 줘: ";

/* p(label, text, opts) — opts: img(이미지 접두어), bad, good, sameAs */
function p(label, text, o){ return Object.assign({label, text}, o||{}); }

const SECTIONS = [
{ id:"start", num:"0", nav:"사용법", title:"활동지 사용 방법", kicker:["시작 전에"],
  goal:"프롬프트를 <strong>복사</strong>해 AI 입력창에 붙여 넣고, <strong>( ) 괄호 안</strong>만 내 이야기로 바꾸면 됩니다. 도구는 ChatGPT 또는 구글 Gemini 중 편한 것을 쓰세요.",
  html:`
  <h3 class="step"><span class="s">글쓰기</span>프롬프트 공식 <small>역할 + 상황 + 요청 + 형식</small></h3>
  <div class="formula">
    <div class="fx"><b>역할</b><span>AI에게 맡길 사람 역할</span><i>너는 고등학생 진로 상담 선생님이야</i></div>
    <div class="fx"><b>상황</b><span>나에 대한 정보, 배경</span><i>나는 철원에 사는 고2 학생이고 간호사에 관심이 있어</i></div>
    <div class="fx"><b>요청</b><span>해 줬으면 하는 일</span><i>이 직업이 하는 일과 필요한 역량을 알려 줘</i></div>
    <div class="fx"><b>형식</b><span>결과를 받고 싶은 모양</span><i>표로, 5가지로, 300자 이내로, 쉬운 말로</i></div>
  </div>
  <h3 class="step"><span class="s">이미지</span>프롬프트 공식</h3>
  <div class="chain"><span>주제</span><i>+</i><span>장면·행동</span><i>+</i><span>배경</span><i>+</i><span>스타일</span><i>+</i><span>분위기·색감</span><i>+</i><span>구도(비율)</span></div>
  <h3 class="step"><span class="s">대화</span>이어가기 요령 <small>마음에 안 드는 부분을 콕 집어 다시 말해요</small></h3>`,
  groups:[{ items:[
    p("쉽게 바꾸기","더 쉽게 설명해 줘. 고등학생 눈높이로 바꿔 줘."),
    p("자세히 듣기","(3번) 내용을 더 자세히 알려 줘."),
    p("모양 바꾸기","표로 다시 정리해 줘. 절반 길이로 줄여 줘."),
    p("더 많이 받기","다른 방향으로 5개 더 제안해 줘.")
  ]}],
  after:`<div class="callout"><div><b>지켜야 할 것</b> · 내 이름·전화번호·주소, 친구 얼굴 사진은 입력하지 않습니다.</div></div>`
},
{ id:"m1", num:"1", nav:"정보탐색", title:"미션 ① 정보탐색", kicker:["1교시","6분"],
  goal:"관심 있는 직업 하나를 AI로 조사해 <strong>‘진로 정보 요약표’</strong>를 만듭니다.",
  groups:[

const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const markup = s => esc(s).replace(/\(([^()]*)\)/g, '<mark class="fill">($1)</mark>');

let jobName = "";
try{ jobName = localStorage.getItem("cw-job") || ""; }catch(e){}

function finalText(it){
  let t = it.text;
  if (it.job && jobName.trim()) t = t.replace(/\(직업명\)/g, jobName.trim());
  return (it.img ? IMG : "") + t;
}
function cardHTML(it, key){
  const tags = (it.bad?'<span class="tag-bad">대충 쓴 버전</span>':'') + (it.good?'<span class="tag-good">공식 적용</span>':'') + (it.img?'<span class="tag-img">이미지</span>':'');
  let shown = it.text;
  if (it.job && jobName.trim()) shown = shown.replace(/\(직업명\)/g, "("+jobName.trim()+")");
  return `<article class="pcard${it.bad?' bad':''}">
    <div class="top"><span class="label">${esc(it.label)}</span>${tags}</div>
    <p class="ptext" data-k="${key}">${it.img?'<span class="prefix">'+esc(IMG.trim())+'</span>':''}${markup(shown)}</p>
    <button class="copy" type="button" data-k="${key}">${COPY_ICON}<span>복사하기</span></button>
  </article>`;
}

const REG = {}; // key -> item
let kc = 0;
function groupHTML(g){
  if (g.job) g.items.forEach(i => i.job = true);
  let h = "";
  if (g.title) h += `<h3 class="step"><span class="s">${esc(g.step)}</span>${esc(g.title)}${g.sub?` <small>${esc(g.sub)}</small>`:''}</h3>`;
  if (g.job) h += `<div class="jobbox"><label for="job">내 관심 직업</label><input type="text" id="job" placeholder="예: 간호사, 웹툰 작가, 수의사" value="${esc(jobName)}"><span class="note" style="margin:0;font-size:.9rem">입력하면 아래 (직업명)이 바뀌어요</span></div>`;
  h += `<div class="grid">` + g.items.map(it => { const k = "k"+(kc++); REG[k]=it; return cardHTML(it,k); }).join("") + `</div>`;
  if (g.note) h += `<p class="note">${esc(g.note)}</p>`;
  return h;
}

/* ── 렌더 ── */
const main = document.getElementById("main"), tabs = document.getElementById("tabs");
main.innerHTML = SECTIONS.map(s => {
  let h = `<section id="${s.id}"><div class="sec-head"><div class="sec-num">${s.num}</div>
    <div class="sec-kicker">${s.kicker.map((k,i)=>`<span class="chip${/분$/.test(k)?' time':''}">${k}</span>`).join("")}</div>
    <h2>${s.title}</h2><p class="goal">${s.goal}</p></div>`;
  if (s.html) h += s.html;
  if (s.groups) h += s.groups.map(groupHTML).join("");
  if (s.custom==="fact") h += factHTML();
  if (s.custom==="mine") h += mineHTML();
  if (s.after) h += s.after;
  return h + `</section>`;
}).join("");
tabs.innerHTML = SECTIONS.map(s => `<a href="#${s.id}" data-id="${s.id}"><b>${s.num}</b>${s.nav}</a>`).join("");

/* 단어 모음 */
const WORDS = [
  ["스타일","수채화, 유화, 연필 스케치, 플랫 일러스트, 3D 애니메이션, 픽셀아트, 실사 사진, 수묵화, 클레이 애니메이션, 팝아트, 웹툰"],
  ["분위기·색감","따뜻한, 신비로운, 밝고 경쾌한, 차분한, 노을빛, 파스텔 톤, 네온, 흑백, 빈티지"],
  ["구도·비율","가로 16:9, 세로 3:4, 정사각형 1:1, 정면, 위에서 내려다본, 가까이 클로즈업, 넓은 풍경"]
];
document.getElementById("words").innerHTML = WORDS.map(([k,v]) =>
  `<div class="row"><b>${k}</b><div class="wchips">${v.split(", ").map(w=>`<button type="button" class="w">${w}</button>`).join("")}</div></div>`).join("");

/* 빌더 */
const val = id => document.getElementById(id).value.trim().replace(/[.。\s]+$/,"");
function buildText(){
  const parts = ["t-role","t-situ","t-req","t-fmt"].map(val).filter(Boolean);
  document.getElementById("t-out").textContent = parts.length ? parts.join(". ")+"." : "칸을 채우면 여기에 프롬프트가 완성돼요.";

function buildImg(){

  const out = document.getElementById("i-out");
  out.innerHTML = parts.length ? `<span class="prefix">${esc(IMG.trim())}</span>${esc(parts.join(", "))}` : "칸을 채우면 여기에 프롬프트가 완성돼요.";

buildText(); buildImg();

/* 직업명 입력 */
const jobInput = document.getElementById("job");
if (jobInput) jobInput.addEventListener("input", () => {
  jobName = jobInput.value;
  try{ localStorage.setItem("cw-job", jobName); }catch(e){}
  document.querySelectorAll("#m1 p.ptext").forEach(el => {
    const it = REG[el.dataset.k]; if (!it || !it.job) return;

/* 복사 */
const toast = document.getElementById("toast"); let tt;
function showToast(msg){ toast.textContent = msg; toast.classList.add("show"); clearTimeout(tt); tt = setTimeout(()=>toast.classList.remove("show"), 2200); }
function fallbackCopy(text){
  const ta = document.getElementById("clip"); ta.value = text; ta.removeAttribute("aria-hidden");
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
  ta.setAttribute("aria-hidden","true"); return ok;
}
function doCopy(text, btn, msg){
  const done = ok => {
    if (ok){
      showToast(msg || "복사했어요! AI 입력창에 붙여 넣으세요 (Ctrl+V)");
      if (btn){ btn.classList.add("done"); const sp = btn.querySelector("span"); const old = sp ? sp.textContent : null;
        if (sp) sp.textContent = "복사됨 ✓"; setTimeout(()=>{ btn.classList.remove("done"); if (sp) sp.textContent = old; }, 1600); }
    } else showToast("복사가 안 됐어요. 글자를 길게 눌러 직접 복사해 주세요.");
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(fallbackCopy(text)));
  } else done(fallbackCopy(text));
}
document.addEventListener("click", e => {
  const b = e.target.closest("button.copy");
  if (b){
    const k = b.dataset.k;
    let text;
    if (k==="t-out") text = document.getElementById("t-out").textContent;
    else if (k==="i-out") text = IMG + ["i-subj","i-scene","i-bg","i-style","i-mood","i-comp"].map(val).filter(Boolean).join(", ");
    else text = finalText(REG[k]);
    doCopy(text, b); return;
  }
  const w = e.target.closest("button.w");
  if (w){ doCopy(w.textContent, null, `‘${w.textContent}’ 복사했어요`); w.classList.add("done"); setTimeout(()=>w.classList.remove("done"),1200); return; }
  const c = e.target.closest("[data-clear]");
  if (c){ document.querySelectorAll("#"+c.dataset.clear+" input").forEach(i=>i.value=""); buildText(); buildImg(); document.querySelector("#"+c.dataset.clear+" input").focus(); }
});

/* 체크리스트 저장 */
document.querySelectorAll(".checks[data-store]").forEach(ul => {
  const key = ul.dataset.store; let saved = {};
  try{ saved = JSON.parse(localStorage.getItem(key) || "{}"); }catch(e){}
  ul.querySelectorAll("input").forEach(i => {
    i.checked = !!saved[i.id];
    i.addEventListener("change", () => { saved[i.id] = i.checked; try{ localStorage.setItem(key, JSON.stringify(saved)); }catch(e){} });
  });
});

/* 탭 활성화 */
const links = [...tabs.querySelectorAll("a")];
const io = new IntersectionObserver(ents => {
  ents.forEach(en => { if (en.isIntersecting){
    links.forEach(a => a.classList.toggle("on", a.dataset.id === en.target.id));
    const on = tabs.querySelector("a.on"); if (on) on.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  }});
}, { rootMargin:"-40% 0px -55% 0px" });
document.querySelectorAll("main section").forEach(s => io.observe(s));
links[0].classList.add("on");
if (location.hash){ const t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(()=>t.scrollIntoView(), 50); }

/* 별 */
const cv = document.getElementById("stars");
function stars(){
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio||1, 2);
  cv.width = r.width*d; cv.height = r.height*d; const x = cv.getContext("2d"); x.scale(d,d);
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  const n = Math.round(r.width*r.height/5000);
  for (let i=0;i<n;i++){ x.fillStyle = `rgba(244,241,228,${0.25+rnd()*0.6})`; x.beginPath(); x.arc(rnd()*r.width, rnd()*r.height*0.8, rnd()*1.3+0.3, 0, Math.PI*2); x.fill(); }
}
stars(); let rz; addEventListener("resize", ()=>{ clearTimeout(rz); rz = setTimeout(stars, 150); });
})();
